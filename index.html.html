<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Y-JUICE Fruit Challenge</title>
<style>
:root{--g:#5a9244;--o:#f0a01f;--d:#0d2a1a;--w:#fffaf0}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--d);color:var(--w);font-family:"Avenir Next","Trebuchet MS",system-ui,sans-serif}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hud{position:fixed;left:0;right:0;top:0;padding:max(12px,env(safe-area-inset-top)) 16px 0;display:none;justify-content:space-between;pointer-events:none}
.hud div{font-size:12px;letter-spacing:.08em;opacity:.85}
.hud b{display:block;font-size:clamp(26px,6vw,42px);letter-spacing:0;font-weight:800;line-height:1.05}
.hud .r{text-align:right}.hud .m{text-align:center}
#tm.low{color:#ff6b5a}
.tools{position:fixed;right:12px;bottom:max(12px,env(safe-area-inset-bottom));display:flex;gap:8px;z-index:3}
.tools button{width:44px;height:44px;border-radius:50%;border:0;background:#ffffff22;color:var(--w);font-size:19px;cursor:pointer;backdrop-filter:blur(6px)}
.tools button.off{opacity:.4}
.scr{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 40%,#0d2a1acc,#0d2a1aee);z-index:2}
.scr.on{display:flex}
.scr img{width:min(260px,62vw);margin-bottom:18px}
h1{font-size:clamp(34px,9vw,64px);margin:0;line-height:1;font-weight:900;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--o)}
.scr p{margin:8px 0;font-size:clamp(16px,4.2vw,20px);opacity:.9}
.btn{margin-top:22px;border:0;border-radius:999px;padding:17px 44px;font-size:20px;font-weight:800;color:#2a1a00;background:linear-gradient(180deg,#ffc24d,var(--o));box-shadow:0 8px 0 #b36f0a,0 14px 28px #0006;cursor:pointer;font-family:inherit}
.btn:active{transform:translateY(4px);box-shadow:0 4px 0 #b36f0a}
.btn.s{background:#ffffff1f;color:var(--w);box-shadow:none;font-size:16px;padding:13px 28px;margin-top:12px}
.stats{display:flex;gap:22px;margin:22px 0 4px}
.stats div{font-size:13px;opacity:.9}.stats b{display:block;font-size:30px;color:var(--o)}
.big{font-size:clamp(56px,16vw,104px);font-weight:900;line-height:1;margin:10px 0}
.tag{margin-top:26px;font-size:13px;letter-spacing:.14em;opacity:.7}
</style></head><body>

const rg=(x,y,r0,r,s)=>{const g=ctx.createRadialGradient(x,y,r0,0,0,r);s.forEach((c,i)=>g.addColorStop(i/(s.length-1),c));return g};

function applePath(r){ctx.beginPath();ctx.moveTo(0,-r*.72);ctx.bezierCurveTo(r*.5,-r*1.05,r*1.1,-r*.6,r*.98,r*.1);ctx.bezierCurveTo(r*.9,r*.7,r*.4,r*1.02,0,r*.88);ctx.bezierCurveTo(-r*.4,r*1.02,-r*.9,r*.7,-r*.98,r*.1);ctx.bezierCurveTo(-r*1.1,-r*.6,-r*.5,-r*1.05,0,-r*.72)}

 if(t==='orange'){

 else if(t==='apple'){

 else if(t==='pineapple'){
  if(!cut){ctx.save();ctx.scale(.82,1.1);disc(r,rg(-r*.3,-r*.3,r*.1,r,['#ffd24a','#d9921c','#8a5410']));ctx.clip();ctx.beginPath();ctx.arc(0,0,r,0,7);ctx.clip();ctx.strokeStyle='rgba(90,45,5,.55)';ctx.lineWidth=2;for(let i=-9;i<=9;i++){ctx.beginPath();ctx.moveTo(i*r*.22-r*2,-r*1.2);ctx.lineTo(i*r*.22+r*2,r*1.2);ctx.moveTo(i*r*.22+r*2,-r*1.2);ctx.lineTo(i*r*.22-r*2,r*1.2);ctx.stroke()}ctx.restore();
   for(let i=-3;i<=3;i++){ctx.save();ctx.translate(0,-r*1.0);ctx.rotate(i*.3);oval(0,-r*.45,r*.1,r*.5,0,i%2?'#4faf3f':'#2f7f2a');ctx.restore()}}
  else{ctx.save();ctx.scale(.82,1.1);disc(r,'#9a6414');disc(r*.94,rg(0,0,r*.1,r*.94,['#fff3a8','#ffd93f','#f0b320']));ctx.restore();oval(0,0,r*.2,r*.28,0,'#fff2b0');ctx.strokeStyle='rgba(255,255,255,.3)';ctx.lineWidth=2;rays(16,r*.25,r*.7,'rgba(255,255,255,.3)',2)}}
 else if(t==='mango'){ctx.rotate(-.4);
  if(!cut){ctx.scale(1.12,.86);disc(r,rg(-r*.3,-r*.3,r*.1,r*1.1,['#ffe066','#ffa22e','#e2452b']));oval(r*.35,r*.2,r*.5,r*.5,0,'rgba(220,40,30,.28)');gloss(r)}
  else{ctx.scale(1.12,.86);disc(r,'#f08a24');disc(r*.93,rg(0,0,r*.1,r*.93,['#ffd54a','#ffbb2d','#f59a1a']));oval(0,0,r*.55,r*.2,0,'#f6e6b4')}}
 else{ // rotten
  if(!cut){applePath(r);ctx.fillStyle=rg(-r*.3,-r*.3,r*.1,r*1.1,['#9aa63a','#5a5a1c','#2a2208']);ctx.fill();ctx.save();applePath(r);ctx.clip();[[.3,.2,.28],[-.4,.35,.22],[.1,-.3,.18],[-.25,-.1,.15]].forEach(p=>oval(p[0]*r,p[1]*r,p[2]*r,p[2]*r*.8,0,'rgba(30,20,5,.7)'));oval(-.1*r,.5*r,.25*r,.15*r,0,'rgba(150,190,90,.55)');ctx.restore();ctx.strokeStyle='#3a2a12';ctx.lineWidth=r*.07;ctx.beginPath();ctx.moveTo(0,-r*.68);ctx.lineTo(r*.12,-r*1.05);ctx.stroke();
   ctx.strokeStyle='rgba(190,70,230,.9)';ctx.lineWidth=3;ctx.setLineDash([6,5]);ctx.beginPath();ctx.arc(0,0,r*1.12,0,7);ctx.stroke()}
  else{applePath(r);ctx.fillStyle='#3a2810';ctx.fill();ctx.save();ctx.scale(.9,.9);applePath(r);ctx.fillStyle='#6b5326';ctx.fill();ctx.restore();oval(r*.2,r*.1,r*.3,r*.2,0,'rgba(120,170,70,.6)')}}
 ctx.restore()}
/* ---------- audio / haptics ---------- */
function tone(f,d,type,v,slide){if(!sound||!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(slide,ac.currentTime+d);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
const sfx={slice:()=>{tone(900,.12,'triangle',.18,300);tone(180,.1,'sine',.2,90)},bad:()=>tone(160,.4,'sawtooth',.25,50),combo:n=>[0,4,7].forEach((s,i)=>setTimeout(()=>tone(520*2**((s+n)/12),.18,'sine',.16),i*70)),end:()=>[0,-3,-7].forEach((s,i)=>setTimeout(()=>tone(440*2**(s/12),.3,'triangle',.2),i*140))};
const buzz=ms=>{if(vib&&navigator.vibrate)navigator.vibrate(ms)};
/* ---------- game logic ---------- */
const multOf=c=>c>=10?5:c>=5?3:c>=3?2:1;
function spawn(){const n=1+Math.floor(rng()*(2+Math.min(2,S.el/20)));
 for(let i=0;i<n;i++){const bad=S.mode==='play'&&S.el>3&&rng()<CONFIG.badChance,type=bad?'rotten':TYPES[Math.floor(rng()*TYPES.length)];
  const x=W*(.15+rng()*.7),h=H*(.5+rng()*.28),vy=-Math.sqrt(2*G*h),T=2*-vy/G,vx=(W/2-x)/T*(.2+rng()*.8)+(rng()-.5)*W*.1;
  S.fruits.push({type,x,y:H+R,vx,vy,rot:rng()*6.28,vr:(rng()-.5)*5,r:R*(type==='watermelon'?1.15:type==='strawberry'||type==='lemon'?.9:1)})}}
function pop(t,x,y,big,col){S.pops.push({t,x,y,big,col:col||'#fff',life:big?1.1:.8,age:0})}
function slice(f,ang){S.fruits.splice(S.fruits.indexOf(f),1);
 for(const side of[-1,1]){const nx=-Math.sin(ang)*side,ny=Math.cos(ang)*side;S.pieces.push({type:f.type,x:f.x,y:f.y,vx:f.vx*.6+nx*170,vy:f.vy*.4+ny*170-60,ang,spin:0,vs:side*(1+rng()*2.5),r:f.r,side})}
 for(let i=0;i<16;i++){const a=rng()*6.283,s=120+rng()*320;S.parts.push({x:f.x,y:f.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-100,life:.8,s:2.5+rng()*5,c:JUICE[f.type]})}
 if(f.type==='rotten'){S.score=Math.max(0,S.score-CONFIG.badPenalty);S.el+=CONFIG.badTimePenalty;S.chain=0;pop('-'+CONFIG.badPenalty,f.x,f.y,false,'#ff6b5a');sfx.bad();buzz([60,40,60]);return}
 const now=S.el;S.chain=now-S.last<CONFIG.comboWindow?S.chain+1:1;S.last=now;S.best=Math.max(S.best,S.chain);S.sliced++;
 const m=multOf(S.chain),pts=CONFIG.points[f.type]*m;S.score+=pts;pop('+'+pts,f.x,f.y,false,'#fff');sfx.slice();buzz(14);
 if(S.chain===3||S.chain===5||S.chain===10){pop(S.chain===10?'JUICE STORM x5':'COMBO x'+m,W/2,H*.32,true,S.chain===10?'#ffc24d':'#9be36b');sfx.combo(S.chain)}}
function segHit(a,b,f){const dx=b.x-a.x,dy=b.y-a.y,l2=dx*dx+dy*dy||1;let t=((f.x-a.x)*dx+(f.y-a.y)*dy)/l2;t=Math.max(0,Math.min(1,t));const px=a.x+t*dx-f.x,py=a.y+t*dy-f.y;return px*px+py*py<(f.r*.92)**2}
function start(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume();
 seed=crypto.getRandomValues(new Uint32Array(1))[0];rng=mulberry(seed);
 S={mode:'play',el:0,score:0,sliced:0,chain:0,best:0,last:-9,fruits:[],pieces:[],parts:[],pops:[],trail:[],sp:0};
 $('start').classList.remove('on');$('end').classList.remove('on');$('hud').style.display='flex'}
function finish(){S.mode='over';sfx.end();let pb=0;try{pb=+localStorage.getItem('yj_best')||0;if(S.score>pb)localStorage.setItem('yj_best',S.score)}catch(e){}
 $('fs').textContent=S.score.toLocaleString('en-US');$('fc').textContent='x'+S.best;$('ff').textContent=S.sliced;
 $('pb').textContent=S.score>pb?'New personal best!':'Personal best: '+pb.toLocaleString('en-US');
 setTimeout(()=>{$('hud').style.display='none';$('end').classList.add('on')},900)}
/* ---------- input ---------- */
let down=false;
const pt=e=>({x:e.clientX,y:e.clientY,t:performance.now()});
cv.addEventListener('pointerdown',e=>{down=true;S.trail=[pt(e)]});
cv.addEventListener('pointermove',e=>{if(!down)return;const p=pt(e),a=S.trail[S.trail.length-1];S.trail.push(p);if(S.trail.length>14)S.trail.shift();
 if(S.mode!=='play'||!a)return;const dx=p.x-a.x,dy=p.y-a.y;if(dx*dx+dy*dy<36)return;const ang=Math.atan2(dy,dx);
 for(const f of S.fruits.slice())if(segHit(a,p,f))slice(f,ang)});
['pointerup','pointercancel','pointerleave'].forEach(n=>cv.addEventListener(n,()=>{down=false}));
/* ---------- loop ---------- */
let prev=performance.now();
function frame(now){const dt=Math.min(.033,(now-prev)/1000);prev=now;
 if(S.mode!=='over'){if(S.mode==='play'){S.el+=dt;if(S.el>=CONFIG.duration){S.el=CONFIG.duration;finish()}}
  S.sp-=dt;if(S.sp<=0){spawn();S.sp=S.mode==='play'?.55+rng()*.6:1.6}}
 const step=S.mode==='over'?dt*.15:dt;
 for(const f of S.fruits){f.vy+=G*step;f.x+=f.vx*step;f.y+=f.vy*step;f.rot+=f.vr*step}S.fruits=S.fruits.filter(f=>f.y<H+R*2||f.vy<0);
 for(const p of S.pieces){p.vy+=G*step;p.x+=p.vx*step;p.y+=p.vy*step;p.spin+=p.vs*step}S.pieces=S.pieces.filter(p=>p.y<H+R*2);
 for(const p of S.parts){p.vy+=G*.6*step;p.x+=p.vx*step;p.y+=p.vy*step;p.life-=dt}S.parts=S.parts.filter(p=>p.life>0);
 for(const p of S.pops){p.age+=dt;p.y-=(p.big?20:50)*dt}S.pops=S.pops.filter(p=>p.age<p.life);
 const nowT=performance.now();S.trail=S.trail.filter(p=>nowT-p.t<180);
 draw();hud();requestAnimationFrame(frame)}
function hud(){const left=Math.max(0,CONFIG.duration-S.el),s=Math.ceil(left);$('sc').textContent=S.score.toLocaleString('en-US');
 $('tm').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');$('tm').className=left<=10?'low':'';$('cb').textContent='x'+multOf(S.chain)}
function draw(){ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 const g=ctx.createRadialGradient(W/2,H*.9,0,W/2,H*.9,H*.8);g.addColorStop(0,'rgba(240,160,31,.28)');g.addColorStop(1,'rgba(240,160,31,0)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 for(const p of S.pieces){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.ang+p.spin);ctx.beginPath();ctx.rect(-p.r*2,p.side>0?0:-p.r*2,p.r*4,p.r*2);ctx.clip();drawFruit(p.type,p.r,true);ctx.restore()}
 for(const f of S.fruits){ctx.save();ctx.translate(f.x,f.y);ctx.rotate(f.rot);ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=14;ctx.shadowOffsetY=6;drawFruit(f.type,f.r,false);ctx.restore()}
 for(const p of S.parts){ctx.globalAlpha=Math.max(0,p.life/.8);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill()}ctx.globalAlpha=1;
 if(S.trail.length>1){ctx.lineCap='round';for(let i=1;i<S.trail.length;i++){const a=S.trail[i-1],b=S.trail[i],k=i/S.trail.length;ctx.strokeStyle=`rgba(255,${200+k*50|0},120,${k})`;ctx.lineWidth=2+k*9;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}}
 ctx.textAlign='center';ctx.lineJoin='round';for(const p of S.pops){const k=p.age/p.life;ctx.globalAlpha=1-k*k;ctx.font=`900 ${p.big?Math.min(54,W*.1):26}px "Avenir Next","Trebuchet MS",system-ui`;ctx.lineWidth=6;ctx.strokeStyle='rgba(0,0,0,.45)';ctx.strokeText(p.t,p.x,p.y);ctx.fillStyle=p.col;ctx.fillText(p.t,p.x,p.y)}ctx.globalAlpha=1}
/* ---------- UI ---------- */
$('go').onclick=start;$('again').onclick=start;
$('bs').onclick=e=>{sound=!sound;e.currentTarget.classList.toggle('off',!sound)};$('bv').onclick=e=>{vib=!vib;e.currentTarget.classList.toggle('off',!vib)};
$('share').onclick=async()=>{const text=`I scored ${S.score.toLocaleString('en-US')} on the Y-JUICE Fruit Challenge! Can you beat me?`;try{if(navigator.share)await navigator.share({title:'Y-JUICE Fruit Challenge',text,url:location.href});else{await navigator.clipboard.writeText(text+' '+location.href);$('share').textContent='LINK COPIED ✓'}}catch(e){}};
document.addEventListener('contextmenu',e=>e.preventDefault());
requestAnimationFrame(frame);
</script></body></html>
